[project]
name = "rag-42"
version = "0.1.0"
description = "Build a Retrieval-Augmented Generation system that answers questions about codebases by retrieving relevant information and generating evidence-based responses, implementing intelligent chunking, efficient retrieval (TF-IDF/BM25)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "accelerate>=1.15.0",
    "bm25s>=0.3.13",
    "fastapi>=0.143.3",
    "fire>=0.7.1",
    "flake8>=7.4.1",
    "langchain-text-splitters>=1.1.3",
    "mypy>=2.4.0",
    "nocamel>=2025.1.0",
    "numpy>=2.2.6",
    "pandas>=2.3.3",
    "pydantic>=2.14.1",
    "torch>=2.14.1",
    "tqdm>=4.70.1",
    "transformers>=5.19.0",
    "uvicorn>=0.54.0",
]
